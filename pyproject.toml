[project]
name = "dtaug"
version = "0.1.0"
description = "VAE-based augmentation of cardiovascular digital-twin parameter sets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
dtaug-generate = "dtaug.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dtaug"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E402 stays on so the `sys.path` shims in scripts/ and tests/ have to say so.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
